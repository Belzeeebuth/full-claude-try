# =============================================================================
#  Harvester — pile complète (bot + PostgreSQL + Redis)
#
#    docker compose up -d db redis      # infrastructure seule (développement)
#    docker compose run --rm bot npm run db:migrate
#    docker compose run --rm bot npm run db:seed
#    docker compose up -d               # tout (bot mono-process)
#    docker compose --profile sharded up -d db redis bot-sharded
#                                       # sharding, à la place de `bot` (voir
#                                       # le service bot-sharded)
#
#  Les secrets viennent de `.env` (jamais commité). Voir `.env.example`.
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: harvester-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-harvester}
      # Pas de valeur de repli sur le MOT DE PASSE : un `.env` absent ou
      # incomplet démarrait la base avec « harvester/harvester ». `:?` fait
      # échouer `docker compose up` avec un message clair plutôt que de poser
      # un identifiant par défaut en silence.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définissez POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-harvester}
      # Le tri français : les classements par nom sortent dans le bon ordre.
      LANG: fr_FR.utf8
    command:
      # Réglages adaptés à une charge de jeu : beaucoup de petites transactions,
      # peu de requêtes analytiques.
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=500
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Lié à la boucle locale UNIQUEMENT. Le bot joint la base par le réseau
      # Docker interne ; ce port n'existe que pour psql/pgAdmin depuis l'hôte.
      # Sans le `127.0.0.1:`, Docker publierait sur 0.0.0.0 en insérant ses
      # propres règles iptables AVANT celles d'ufw : la base serait joignable
      # depuis Internet malgré un pare-feu actif.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-harvester} -d ${POSTGRES_DB:-harvester}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: harvester-redis
    restart: unless-stopped
    # `appendonly` : les cooldowns longs et les files BullMQ survivent à un
    # redémarrage. `maxmemory-policy noeviction` : on ne veut PAS que Redis
    # supprime silencieusement un job de la file sous pression mémoire.
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    ports:
      # Boucle locale uniquement — Redis n'a pas d'authentification ici.
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: harvester-bot
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-harvester}:${POSTGRES_PASSWORD:?définissez POSTGRES_PASSWORD dans .env}@db:5432/${POSTGRES_DB:-harvester}
      REDIS_URL: redis://redis:6379
      HTTP_PORT: 3001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # /health et /metrics ne sont pas authentifiés : jamais exposés publiquement.
      # Pour les consulter à distance, passez par un tunnel SSH :
      #   ssh -L 3001:127.0.0.1:3001 user@vps
      - '127.0.0.1:${HTTP_PORT:-3001}:3001'
    volumes:
      # Les sprites peuvent être remplacés sans reconstruire l'image.
      - ./assets:/app/assets:ro
    deploy:
      resources:
        limits:
          memory: 1g

  # ---------------------------------------------------------------------------
  # Variante shardée (constat D-01) : MÊME image, MÊMES variables (héritées de
  # `bot` par `extends`), seul le point d'entrée change — `node dist/shard.js`
  # (ShardingManager, src/shard.ts), qui lance un process `index.js` par shard.
  # Discord l'impose au-delà de 2 500 serveurs ; en dessous, `bot` suffit et
  # coûte moins de mémoire.
  #
  # Sous un profil pour ne JAMAIS démarrer par accident à côté de `bot` : deux
  # process avec le même jeton se disputeraient la passerelle Discord, et le
  # même port 3001 sur l'hôte. Un service sans profil démarre toujours, donc
  # le lancer doit EXCLURE `bot` en nommant les services :
  #     docker compose --profile sharded up -d db redis bot-sharded
  #
  # Le choix passe par HARVESTER_ENTRYPOINT, lu par le CMD du Dockerfile, et
  # non par un `command:` local : une seule définition du point d'entrée,
  # valable aussi pour un `docker run` hors compose.
  #
  # SCHEDULER_ENABLED : src/shard.ts prévoit que seul le shard 0 porte
  # l'ordonnanceur, mais ShardingManager copie l'environnement du gestionnaire
  # dans CHAQUE enfant (discord.js, sharding/Shard.js) : la valeur héritée de
  # `.env` vaut donc pour tous les shards, et compose ne peut pas la poser par
  # shard. Ce n'est pas bloquant — BullMQ n'enregistre un job répétable qu'une
  # fois dans Redis, quel que soit le nombre de process qui le déclarent —, mais
  # ne PAS la forcer à false ici : plus aucun shard ne planifierait rien.
  #
  # LIMITE CONNUE (à lever dans src/index.ts, hors de ce fichier) : chaque
  # shard exécute `startHealthServer` sur le même HTTP_PORT. Le shard 0 sert
  # /health — le HEALTHCHECK de l'image reste donc valable — mais à partir du
  # deuxième shard `listen` échoue (EADDRINUSE), l'exception fait sortir le
  # process et le ShardingManager le relance en boucle. Tant que le serveur
  # HTTP n'est pas réservé au shard 0 (`SHARDS=0`, posé par discord.js), ce
  # profil n'est sûr qu'avec SHARDING_TOTAL=1 : il câble le mécanisme, il ne
  # remplace pas cette correction.
  # ---------------------------------------------------------------------------
  bot-sharded:
    extends:
      service: bot
    container_name: harvester-bot-sharded
    profiles: [sharded]
    environment:
      HARVESTER_ENTRYPOINT: shard
    # `depends_on` n'est jamais hérité par `extends` (spécification Compose) :
    # redéclaré, sinon le gestionnaire démarrerait avant la base et le premier
    # shard échouerait au `pingDatabase()` du démarrage.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Un process Node complet par shard (pool PostgreSQL et connexions
          # Redis compris) : 1 Go ne tient plus dès trois ou quatre shards.
          # Garder aussi DATABASE_POOL_MAX × shards < max_connections de `db`
          # (200), le pool est dimensionné PAR shard.
          memory: 2g

volumes:
  db-data:
  redis-data:
